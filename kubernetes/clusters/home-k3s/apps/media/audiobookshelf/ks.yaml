---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app audiobookshelf
  namespace: &namespace media
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../../../shared/components/gatus/guarded
    - ../../../../../../shared/components/volsync
  dependsOn:
    - name: onepassword
      namespace: external-secrets
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: storage
      namespace: media
  interval: 30m
  path: ./kubernetes/clusters/home-k3s/apps/media/audiobookshelf/app
  postBuild:
    substitute:
      APP: *app
      GATUS_SUBDOMAIN: audiobookshelf
      VOLSYNC_CAPACITY: 5Gi
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
