---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app beets
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      beets:
        initContainers:
          fix-permissions:
            image:
              repository: busybox
              tag: latest
            command:
              - /bin/sh
              - -c
              - |
                echo "Fixing directory permissions..."
                find /music -type d ! -perm -g+w -exec chmod g+w {} \; 2>/dev/null || true
                find /downloads -type d ! -perm -g+w -exec chmod g+w {} \; 2>/dev/null || true
                find /manual -type d ! -perm -g+w -exec chmod g+w {} \; 2>/dev/null || true
                chown -R 1000:1000 /config 2>/dev/null || true
                echo "Done."
            securityContext:
              runAsUser: 0
              runAsGroup: 0
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/beets
              tag: latest@sha256:82d042fa56b3371bd12442446c7c78af312871dcf94344409dbee0678b9f910e
            env:
              TZ: ${TZ}
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
            resources:
              requests:
                cpu: 10m
                memory: 512Mi
              limits:
                memory: 2Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        controller: *app
        ports:
          http:
            port: &port 8337

    route:
      app:
        hostnames: ["{{ .Release.Name }}.${INTERNAL_DOMAIN}"]
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/icon: beets.png
          gethomepage.dev/name: Beets
          gethomepage.dev/group: Media
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port

    persistence:
      config:
        existingClaim: beets
        globalMounts:
          - path: /config
      downloads:
        existingClaim: music-incoming
        globalMounts:
          - path: /downloads
            subPath: complete
          - path: /manual
            subPath: manual
      music:
        existingClaim: music
        globalMounts:
          - path: /music
      config-file:
        type: configMap
        name: beets-configmap
        advancedMounts:
          beets:
            app:
              - path: /config/config.yaml
                subPath: config.yaml
                readOnly: true
      run:
        type: emptyDir
        advancedMounts:
          beets:
            app:
              - path: /run
