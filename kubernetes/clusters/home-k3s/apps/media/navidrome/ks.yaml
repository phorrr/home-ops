---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app navidrome
  namespace: &namespace media
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../../../shared/components/volsync
    - ../../../../../../shared/components/gatus/guarded
  dependsOn:
    - name: onepassword
      namespace: external-secrets
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 30m
  path: ./kubernetes/clusters/home-k3s/apps/media/navidrome/app
  postBuild:
    substitute:
      APP: *app
      AUTHELIA_GROUP: navidrome
      AUTHELIA_HTTPROUTE: navidrome-app
      AUTHELIA_SUBDOMAIN: music
      GATEWAY_DOMAIN: ${DOMAIN}
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
