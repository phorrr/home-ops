---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app navidrome
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      navidrome:
        containers:
          app:
            image:
              repository: ghcr.io/navidrome/navidrome
              tag: 0.59.0@sha256:4edc8a1de3e042f30b78a478325839f4395177eb8201c27543dccc0eba674f23
            env:
              TZ: ${TZ}
              ND_BASEURL: "/"
              ND_COVERARTPRIORITY: "folder.*, cover.*, front.*"
              ND_DATAFOLDER: /config
              ND_DEFAULTLANGUAGE: en
              ND_ENABLEINSIGHTSCOLLECTOR: "false"
              ND_LOGLEVEL: info
              ND_MUSICFOLDER: /music
              ND_PORT: &port 80
              ND_SCANINTERVAL: 1m
              ND_SESSIONTIMEOUT: 30m
              ND_TRANSCODINGCACHESIZE: 100MB
              # Reverse proxy authentication via Authelia
              ND_REVERSEPROXYUSERHEADER: Remote-User
              ND_REVERSEPROXYWHITELIST: 10.30.0.0/16
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 1Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port

    route:
      app:
        hostnames: ["music.${DOMAIN}"]
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/icon: navidrome.png
          gethomepage.dev/name: Navidrome
          gethomepage.dev/group: Media
          gethomepage.dev/widget.type: navidrome
          gethomepage.dev/widget.url: http://navidrome.media.svc.cluster.local:80
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
            matches:
              - path:
                  type: PathPrefix
                  value: /
      # Separate route for Subsonic API - no SecurityPolicy attached
      # Subsonic clients authenticate via query params (u=user&p=pass or token)
      api:
        hostnames: ["music.${DOMAIN}"]
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
            matches:
              - path:
                  type: PathPrefix
                  value: /rest

    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /config
      music:
        existingClaim: music
        globalMounts:
          - path: /music
            readOnly: true
      cache:
        type: emptyDir
        globalMounts:
          - path: /config/cache
      tmp:
        type: emptyDir
