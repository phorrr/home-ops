---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app libation
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      libation:
        type: cronjob
        annotations:
          reloader.stakater.com/auto: "true"
        cronjob:
          schedule: "0 3 * * *"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 3
          failedJobsHistory: 3
          ttlSecondsAfterFinished: 86400
          activeDeadlineSeconds: 14400
        initContainers:
          01-copy-config:
            image:
              repository: docker.io/library/busybox
              tag: latest
            command:
              - /bin/sh
              - -c
              - |
                cp /secret/AccountsSettings.json /config/AccountsSettings.json
                cat > /config/Settings.json << 'EOF'
                {
                  "FolderTemplate": "<author>/<series>/<title>"
                }
                EOF
                chown 1001:1001 /config/AccountsSettings.json /config/Settings.json
            securityContext:
              runAsUser: 0
              runAsNonRoot: false
        containers:
          app:
            image:
              repository: docker.io/rmcrackan/libation
              tag: latest@sha256:2eb9a9153f5bfa13da1f6fbfa5bd68ed456749f8ef502011cc073d60067b33fc
            env:
              TZ: ${TZ}
              SLEEP_TIME: "-1"
              LIBATION_CONFIG_DIR: /config
              LIBATION_BOOKS_DIR: /audiobooks
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 4Gi
        pod:
          restartPolicy: OnFailure

    defaultPodOptions:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        runAsNonRoot: true
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 65539

    persistence:
      audiobooks:
        existingClaim: audiobooks
        globalMounts:
          - path: /audiobooks
      config:
        existingClaim: *app
        globalMounts:
          - path: /config
      audible-secret:
        type: secret
        name: libation-audible-secret
        globalMounts:
          - path: /secret
            readOnly: true
