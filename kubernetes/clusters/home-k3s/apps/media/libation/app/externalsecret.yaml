---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: libation-audible
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: libation-audible-secret
    template:
      data:
        AccountsSettings.json: '{{ index . "AccountSettings.json" }}'
  dataFrom:
    - extract:
        key: libation
