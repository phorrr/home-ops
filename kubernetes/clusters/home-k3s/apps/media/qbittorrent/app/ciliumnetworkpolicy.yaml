---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: qbittorrent-vpn-only
  namespace: media
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  egress:
    # Allow DNS lookups to kube-dns
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    
    # Allow access to Kubernetes API
    - toEntities:
        - kube-apiserver
    
    # Allow traffic within the cluster (for cross-seed, prowlarr, etc)
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: media
    
    # Allow traffic to local networks (home network)
    - toCIDRSet:
        - cidr: REDACTED_PRIVATE_CIDR
        - cidr: REDACTED_PRIVATE_CIDR
        - cidr: REDACTED_PRIVATE_CIDR
    
    # Allow ONLY to ProtonVPN WireGuard endpoint (UDP + ICMP for connectivity checks)
    - toCIDRSet:
        - cidr: ${VPN_ENDPOINT_IP}/32
      toPorts:
        - ports:
            - port: "51820"
              protocol: UDP
      icmps:
        - fields:
            - type: 8
              family: IPv4
    
    # Allow traffic through the VPN tunnel (tun0 interface)
    # This is handled internally by the shared network namespace
    # between gluetun and qbittorrent containers