---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: forgejo-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Redis (Dragonfly in same namespace)
        REDIS_URL: "redis://forgejo-dragonfly.forgejo.svc.cluster.local:6379"
        # Security tokens (generated once, stored for DR)
        FORGEJO_SECRET_KEY: "{{ .secret_key }}"
        FORGEJO_INTERNAL_TOKEN: "{{ .internal_token }}"
        # Anubis cookie signing key
        ANUBIS_PRIVATE_KEY: "{{ .anubis_private_key }}"
        # OAuth credentials (from Authelia item)
        # Chart expects 'key' and 'secret' when using existingSecret
        key: "{{ .FORGEJO_OAUTH_CLIENT_ID }}"
        secret: "{{ .FORGEJO_OAUTH_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: forgejo
    - extract:
        key: authelia
