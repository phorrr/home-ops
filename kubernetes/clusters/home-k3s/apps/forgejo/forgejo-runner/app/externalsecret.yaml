---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-runner
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: forgejo-runner-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Forgejo API token with runner:read scope
        token: "{{ .api_token }}"
        # Runner registration token (from Forgejo admin settings)
        RUNNER_SECRET: "{{ .runner_token }}"
  dataFrom:
    - extract:
        key: forgejo
