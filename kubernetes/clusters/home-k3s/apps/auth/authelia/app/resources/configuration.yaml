# Zed users, save this file with CMD+K, s
---
log:
  level: info

authentication_backend:
  ldap:
    address: REDACTED_INTERNAL_LDAP_ENDPOINT
    implementation: custom
    timeout: 5s
    start_tls: false
    additional_users_dn: ou=people
    users_filter: (&({username_attribute}={input})(objectClass=person))
    additional_groups_dn: ou=groups
    groups_filter: (member={dn})
    attributes:
      username: uid
      display_name: displayName
      group_name: cn
      mail: mail
      member_of: memberOf
      extra:
        immichrole:
          multi_valued: false
          value_type: "string"
        immichquota:
          multi_valued: false
          value_type: "integer"
  password_reset:
    disable: false
  refresh_interval: 1m

definitions:
  user_attributes:
    immich_role:
      expression: 'immichrole != "" ? immichrole : "user"'
    immich_quota:
      expression: "immichquota"
regulation:
  max_retries: 3
  find_time: 1h
  ban_time: 1d

session:
  name: authelia-home-ops
  inactivity: 3d
  expiration: 7d
  remember_me: 6M
  cookies:
    - domain: ${DOMAIN}
      authelia_url: https://auth.${DOMAIN}
    - domain: ${INTERNAL_DOMAIN}
      authelia_url: https://auth.${INTERNAL_DOMAIN}
  redis:
    host: REDACTED_INTERNAL_DB_HOST

access_control:
  default_policy: deny
  networks:
    - name: internal
      networks:
        - REDACTED_PRIVATE_CIDR
        - REDACTED_PRIVATE_CIDR
        - REDACTED_PRIVATE_CIDR
    - name: trusted
      networks:
        - REDACTED_PRIVATE_IP/24
  rules:
    # This just reduces logging noise in authelia
    - domain:
        - whoami.${DOMAIN}
      resources:
        - ^/health$
        - ^/health/
      policy: bypass

notifier:
  disable_startup_check: true
  smtp:
    address: REDACTED_INTERNAL_SMTP_ENDPOINT
    sender: 'Authelia at ${DOMAIN} <{{ env "SMTP_SENDER" }}>'

identity_validation:
  reset_password:
    jwt_secret: '{{ env "JWT_SECRET" }}'

identity_providers:
  oidc:
    cors:
      endpoints:
        - authorization
        - token
        - revocation
        - introspection
      allowed_origins_from_client_redirect_uris: true
    claims_policies:
      ## Creates the 'default' claims policy.
      default:
        id_token:
          [
            "groups",
            "email",
            "email_verified",
            "alt_emails",
            "preferred_username",
            "name",
          ]
      immich:
        id_token:
          [
            "groups",
            "email",
            "email_verified",
            "alt_emails",
            "preferred_username",
            "name",
          ]
        custom_claims:
          immich_role:
            name: 'immich_role'
            attribute: 'immich_role'
          immich_quota:
            name: 'immich_quota'
            attribute: 'immich_quota'
    scopes:
      immich:
        claims:
          - "immich_role"
          - "immich_quota"

    jwks:
      - key_id: default
        algorithm: RS256
        use: sig
        key: {{ secret "/secrets/jwk-rsa/tls.key" | mindent 10 "|" | msquote }}
        certificate_chain: {{ secret "/secrets/jwk-rsa/tls.crt" | mindent 10 "|" | msquote }}
      - key_id: ecdsa256
        algorithm: ES256
        use: sig
        key: {{ secret "/secrets/jwk-ecdsa/tls.key" | mindent 10 "|" | msquote }}
        certificate_chain: {{ secret "/secrets/jwk-ecdsa/tls.crt" | mindent 10 "|" | msquote }}
    clients:
      - client_id: '{{ env "GRAFANA_OAUTH_CLIENT_ID" }}'
        client_name: Grafana
        client_secret: '{{ env "GRAFANA_OAUTH_CLIENT_SECRET_DIGEST" }}'
        public: false
        authorization_policy: two_factor
        pre_configured_consent_duration: 1y
        scopes: ["openid", "profile", "groups", "email"]
        redirect_uris: ["https://grafana.${INTERNAL_DOMAIN}/login/generic_oauth"]
        token_endpoint_auth_method: client_secret_post
        userinfo_signed_response_alg: none
      - client_id: '{{ env "PROXMOX_HOME_OAUTH_CLIENT_ID" }}'
        client_name: Proxmox Home
        client_secret: '{{ env "PROXMOX_HOME_OAUTH_CLIENT_SECRET_DIGEST" }}'
        public: false
        authorization_policy: two_factor
        pre_configured_consent_duration: 1y
        scopes: ["openid", "profile", "groups", "email"]
        response_types: ["code"]
        grant_types: ["authorization_code"]
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris: ["https://proxmox-0.${INTERNAL_DOMAIN}/"]
        token_endpoint_auth_method: client_secret_basic
        access_token_signed_response_alg: none
        userinfo_signed_response_alg: none
      - client_id: '{{ env "HOMEASSISTANT_OAUTH_CLIENT_ID" }}'
        client_name: 'Home Assistant'
        client_secret: '{{ env "HOMEASSISTANT_OAUTH_CLIENT_SECRET_DIGEST" }}'
        public: false
        require_pkce: true
        pkce_challenge_method: 'S256'
        authorization_policy: 'two_factor'
        redirect_uris:
          - 'https://hass.${INTERNAL_DOMAIN}/auth/oidc/callback'
        scopes:
          - 'openid'
          - 'profile'
          - 'groups'
        id_token_signed_response_alg: 'RS256'
        token_endpoint_auth_method: 'client_secret_post'
      - client_name: Immich
        client_id: '{{ env "IMMICH_OAUTH_CLIENT_ID" }}'
        client_secret: '{{ env "IMMICH_OAUTH_CLIENT_SECRET" }}'
        public: false
        authorization_policy: two_factor
        pre_configured_consent_duration: 1y
        scopes:
          - openid
          - profile
          - email
          - immich
        redirect_uris:
          - https://photos.${DOMAIN}/auth/login
          - app.immich:/
          - app.immich:///oauth-callback
        userinfo_signed_response_alg: none
        claims_policy: immich
        token_endpoint_auth_method: client_secret_post
      - client_name: Paperless
        client_id: '{{ env "PAPERLESS_OAUTH_CLIENT_ID" }}'
        client_secret: '{{ env "PAPERLESS_OAUTH_CLIENT_SECRET" }}'
        public: false
        authorization_policy: two_factor
        pre_configured_consent_duration: 1y
        scopes:
          - openid
          - profile
          - email
        redirect_uris:
          - https://paperless.${INTERNAL_DOMAIN}/accounts/oidc/authelia/login/callback/
        userinfo_signed_response_alg: none
        claims_policy: default
      - client_name: Windmill
        client_id: '{{ env "WINDMILL_OAUTH_CLIENT_ID" }}'
        client_secret: '{{ env "WINDMILL_OAUTH_CLIENT_SECRET" }}'
        public: false
        authorization_policy: two_factor
        pre_configured_consent_duration: 1y
        require_pkce: false
        scopes:
          - openid
          - profile
          - email
          - groups
        response_types:
          - code
        grant_types:
          - authorization_code
        redirect_uris:
          - https://windmill.${DOMAIN}/user/login_callback/authelia
        userinfo_signed_response_alg: none
        claims_policy: default
        token_endpoint_auth_method: client_secret_basic
      - client_name: Audiobookshelf
        client_id: '{{ env "AUDIOBOOKSHELF_OAUTH_CLIENT_ID" }}'
        client_secret: '{{ env "AUDIOBOOKSHELF_OAUTH_CLIENT_SECRET_DIGEST" }}'
        public: false
        authorization_policy: two_factor
        pre_configured_consent_duration: 1y
        require_pkce: true
        pkce_challenge_method: S256
        scopes:
          - openid
          - profile
          - email
        redirect_uris:
          - https://audiobookshelf.${DOMAIN}/auth/openid/callback
          - https://audiobookshelf.${DOMAIN}/auth/openid/mobile-redirect
          - audiobookshelf://oauth-callback
          - shelfplayer://callback
        userinfo_signed_response_alg: none
        claims_policy: default
        token_endpoint_auth_method: client_secret_basic
      - client_name: Forgejo
        client_id: '{{ env "FORGEJO_OAUTH_CLIENT_ID" }}'
        client_secret: '{{ env "FORGEJO_OAUTH_CLIENT_SECRET_DIGEST" }}'
        public: false
        authorization_policy: two_factor
        pre_configured_consent_duration: 1y
        require_pkce: true
        pkce_challenge_method: S256
        scopes:
          - openid
          - profile
          - email
          - groups
        redirect_uris:
          - https://forge.${DOMAIN}/user/oauth2/Authelia/callback
        userinfo_signed_response_alg: none
        claims_policy: default
        token_endpoint_auth_method: client_secret_basic
password_policy:
  standard:
    enabled: false
    min_length: 8
    max_length: 0
    require_uppercase: false
    require_lowercase: false
    require_number: false
    require_special: false
  zxcvbn:
    enabled: true
    min_score: 4
