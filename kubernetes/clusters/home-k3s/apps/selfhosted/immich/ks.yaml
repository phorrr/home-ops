---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app immich
  namespace: &namespace selfhosted
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../../../shared/components/cnpg
    - ../../../../../../shared/components/dragonfly
    - ../../../../../../shared/components/gatus/external
    - ../../../../../../shared/components/volsync
  dependsOn:
    - name: cloudnative-pg-cluster
      namespace: database
    - name: dragonfly-operator
      namespace: database
    - name: onepassword
      namespace: external-secrets
  interval: 30m
  path: ./kubernetes/clusters/home-k3s/apps/selfhosted/immich/app
  postBuild:
    substitute:
      APP: *app
      GATUS_SUBDOMAIN: photos
      CNPG_NAME: *app
      VOLSYNC_CAPACITY: 500Gi
      VOLSYNC_STORAGECLASS: ceph-filesystem-ec
      VOLSYNC_ACCESSMODES: ReadWriteMany
      VOLSYNC_CACHE_CAPACITY: 10Gi
      VOLSYNC_CACHE_ACCESSMODES: ReadOnlyMany
      VOLSYNC_SNAPSHOTCLASS: csi-ceph-fs
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
