---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: windmill-oauth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: windmill-oauth-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        oauth.json: |
          {
            "authelia": {
              "id": "{{ .WINDMILL_OAUTH_CLIENT_ID }}",
              "secret": "{{ .WINDMILL_OAUTH_CLIENT_SECRET }}",
              "connect_config": {
                "issuer_url": "https://REDACTED_DOMAIN",
                "scopes": ["openid", "profile", "email", "groups"]
              }
            }
          }
  dataFrom:
    - extract:
        key: authelia
