---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app paperless
  namespace: &namespace selfhosted
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../../../shared/components/cnpg
    - ../../../../../../shared/components/dragonfly
    - ../../../../../../shared/components/gatus/guarded
    - ../../../../../../shared/components/volsync
  interval: 30m
  path: ./kubernetes/clusters/home-k3s/apps/selfhosted/paperless/app
  postBuild:
    substitute:
      APP: *app
      GATUS_SUBDOMAIN: paperless
      VOLSYNC_CACHE_CAPACITY: 8Gi
      VOLSYNC_CAPACITY: 8Gi
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
