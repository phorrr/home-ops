---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-registry
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: forgejo-registry
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"REDACTED_DOMAIN":{"username":"{{ .USERNAME }}","password":"{{ .TOKEN }}","auth":"{{ printf "%s:%s" .USERNAME .TOKEN | b64enc }}"}}}
  data:
    - secretKey: USERNAME
      remoteRef:
        key: forgejo-registry
        property: USERNAME
    - secretKey: TOKEN
      remoteRef:
        key: forgejo-registry
        property: TOKEN
