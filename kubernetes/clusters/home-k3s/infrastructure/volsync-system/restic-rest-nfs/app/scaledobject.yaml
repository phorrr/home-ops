---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: restic-rest-nfs-scaler
spec:
  advanced:
    restoreToOriginalReplicaCount: true
  cooldownPeriod: 0
  minReplicaCount: 0
  maxReplicaCount: 1
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: restic-rest-nfs
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://vmsingle-stack.observability.svc.cluster.local:8428
        query: probe_success{instance="zapp.${INTERNAL_DOMAIN}:2049"}
        threshold: "1"
        ignoreNullValues: "0"
