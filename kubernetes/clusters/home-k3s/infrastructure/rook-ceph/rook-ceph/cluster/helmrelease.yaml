---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: rook-ceph-cluster
      version: v1.18.8
      sourceRef:
        kind: HelmRepository
        name: rook-ceph
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: rook-ceph-operator
      namespace: rook-ceph
    - name: volsync
      namespace: volsync-system
  values:
    monitoring:
      enabled: true
      createPrometheusRules: true
    ingress:
      dashboard:
        ingressClassName: internal
        host:
          name: rook-k3s.${INTERNAL_DOMAIN}
          path: /
    toolbox:
      enabled: true
      resources:
        requests:
          cpu: 10m
    configOverride: |
      [global]
      bdev_enable_discard = true
      bdev_async_discard = true
      osd_class_update_on_start = false
    cephClusterSpec:
      crashCollector:
        disable: false
      csi:
        readAffinity:
          enabled: true
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
        # prometheusEndpoint: http://prometheus-operated.observability.svc.cluster.local:9090
      mgr:
        modules:
          - name: insights
            enabled: true
          - name: pg_autoscaler
            enabled: true
          - name: rook
            enabled: true
      mon:
        count: 3
        allowMultiplePerNode: false
        volumeClaimTemplate:
          spec:
            storageClassName: zfs-local-dataset
            resources:
              requests:
                storage: 10Gi
      network:
        provider: host
        connections:
          requireMsgr2: true
      storage:
        useAllNodes: false
        useAllDevices: false
        nodes:
          - name: k3s-bd795-1
            devices:
              - name: REDACTED_DEVICE_ID
                config:
                  deviceClass: nvme
              - name: REDACTED_DEVICE_ID
              - name: REDACTED_DEVICE_ID
              - name: REDACTED_DEVICE_ID
              - name: REDACTED_DEVICE_ID
              - name: REDACTED_DEVICE_ID
          - name: k3s-bd795-2
            devices:
              - name: REDACTED_DEVICE_ID
                config:
                  deviceClass: nvme
              - name: REDACTED_DEVICE_ID
              - name: REDACTED_DEVICE_ID
              - name: REDACTED_DEVICE_ID
              - name: REDACTED_DEVICE_ID
              - name: REDACTED_DEVICE_ID
          - name: k3s-bd795-3
            devices:
              - name: REDACTED_DEVICE_ID
                config:
                  deviceClass: nvme
              - name: REDACTED_DEVICE_ID
              - name: REDACTED_DEVICE_ID
              - name: REDACTED_DEVICE_ID
              - name: REDACTED_DEVICE_ID
              - name: REDACTED_DEVICE_ID
              - name: REDACTED_DEVICE_ID
        config:
          encryptedDevice: "true"
          osdsPerDevice: "1"
      healthCheck:
        daemonHealth:
          mon:
            interval: 45s
          osd:
            interval: 1m0s
          status:
            interval: 1m0s
        livenessProbe:
          mgr:
            probe:
              periodSeconds: 15
              timeoutSeconds: 10
          mon:
            probe:
              periodSeconds: 15
              timeoutSeconds: 10
          osd:
            probe:
              periodSeconds: 90
              timeoutSeconds: 900

      resources:
        mgr:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 4Gi
        mon:
          requests:
            cpu: 300m
        osd:
          requests:
            cpu: 300m
          limits:
            memory: 8Gi
        prepareosd:
          requests:
            cpu: 100m
        mgr-sidecar:
          requests:
            cpu: 10m
        crashcollector:
          requests:
            cpu: 10m
        logcollector:
          requests:
            cpu: 10m
        alertmanager:
          requests:
            cpu: 10m
        cleanup:
          requests:
        exporter:
          requests:
            cpu: 10m

    cephBlockPools:
      - name: ceph-blockpool-replicated
        spec:
          failureDomain: host
          replicated:
            size: 3
          deviceClass: ssd
        storageClass:
          enabled: true
          name: ceph-block-replicated
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          mountOptions: ["discard"]
          parameters:
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
      - name: ceph-blockpool-ec
        spec:
          failureDomain: osd
          erasureCoded:
            dataChunks: 4
            codingChunks: 2
          deviceClass: ssd
        storageClass:
          enabled: true
          name: ceph-block-ec
          isDefault: false
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          mountOptions: ["discard"]
          parameters:
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
      - name: ceph-blockpool-nvme
        spec:
          failureDomain: host
          replicated:
            size: 3
          deviceClass: nvme
        storageClass:
          enabled: true
          name: ceph-block-nvme
          isDefault: false
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          mountOptions: ["discard"]
          parameters:
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
      isDefault: false
      deletionPolicy: Delete

    cephFileSystems:
      - name: cephfs
        spec:
          preservePoolNames: true
          preserveFilesystemOnDelete: true
          metadataPool:
            name: cephfs-metadata
            replicated:
              size: 3
            deviceClass: nvme
          dataPools:
            - name: cephfs-data-replicated
              replicated:
                size: 2
              deviceClass: nvme
              parameters:
                compression_algorithm: "lz4"
                compression_mode: "aggressive"
            - name: cephfs-data-ec
              erasureCoded:
                dataChunks: 4
                codingChunks: 2
          metadataServer:
            activeCount: 1
            activeStandby: true
            resources:
              limits:
                memory: "4Gi"
              requests:
                cpu: "1000m"
                memory: "4Gi"
            priorityClassName: system-cluster-critical
        storageClass:
          enabled: true
          isDefault: false
          name: ceph-filesystem-ec
          pool: data-ec
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: "Immediate"
          parameters:
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
    cephFileSystemVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-fs
      isDefault: false
      deletionPolicy: Delete

    cephObjectStores:
      - name: ceph-objectstore
        spec:
          metadataPool:
            failureDomain: host
            replicated:
              size: 3
            deviceClass: nvme
          dataPool:
            failureDomain: osd
            erasureCoded:
              dataChunks: 4
              codingChunks: 2
            deviceClass: ssd
          preservePoolsOnDelete: true
          gateway:
            port: 80
            instances: 2
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
        storageClass:
          enabled: true
          name: ceph-bucket
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
